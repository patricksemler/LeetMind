# M5 metrics stack (PLAN.md §10 M5, §14 Observability: "Prometheus + Grafana + load-test harness
# deferred to M5"; docs/CONTRACTS.md §0 lists this file explicitly as "docker-compose.metrics.yml
# # M5 profile").
#
# Deliberately a SEPARATE compose file, gated behind the `metrics` profile, so `docker compose up`
# (the day-to-day command) never starts these — PLAN.md defers Prometheus/Grafana to M5 on purpose
# and it must not become mandatory just to run the app.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml --profile metrics up -d
# or, if you only want the metrics stack (e.g. api/judge already running as host processes via
# `pnpm dev:api` / `pnpm dev:judge`, the documented local-dev workflow — see README "Quickstart"):
#   docker compose -f docker-compose.metrics.yml --profile metrics up -d
#
# Prometheus scrapes GET /metrics on the api service (apps/api/src/routes/metrics.ts). Grafana is
# provisioned with a datasource + one dashboard on boot — no manual clicking required. Grafana at
# http://localhost:3001 (3000 is commonly already taken locally), Prometheus at
# http://localhost:9090.

networks:
  leetmind:
    name: leetmind
    # `external: true` when the main docker-compose.yml's network already exists (i.e. you're
    # running this alongside the full stack) — `docker compose -f a -f b up` creates it once from
    # docker-compose.yml's definition and this file just joins it. If you run this file STANDALONE
    # (api/judge as host processes, nothing else from docker-compose.yml up), Compose will fail to
    # find an external network named `leetmind`; drop `external: true` in that case, or run
    # `docker network create leetmind` first. Kept as `external: true` here because the documented
    # one-liner above always brings up docker-compose.yml first.
    external: true

volumes:
  leetmind-prometheus-data:
  leetmind-grafana-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    profiles: ["metrics"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - leetmind-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    extra_hosts:
      # Makes host.docker.internal resolvable on native Linux too (Docker Desktop on macOS/Windows
      # already provides it) — see docker/prometheus/prometheus.yml's comment for why this target
      # is listed at all: it's how Prometheus reaches an api started via `pnpm dev:api` on the host.
      - "host.docker.internal:host-gateway"
    networks:
      - leetmind

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    profiles: ["metrics"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # First dashboard a viewer sees on load — no clicking to find it (PLAN.md M5 requirement).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leetmind.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - leetmind-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - leetmind
