# Prometheus scrape config for the M5 metrics profile (docker-compose.metrics.yml).
#
# Two targets are listed for the same job because LeetMind has two legitimate ways to run the API
# locally (see README "Quickstart"): as a host process (`pnpm dev:api`, the documented day-to-day
# workflow) or as the dockerized `api` service on the `leetmind` compose network. Only one is
# usually up at a time; Prometheus just shows the other target as `down`, which is harmless and
# visible under Status > Targets rather than silently missing data. `host.docker.internal` is
# resolvable from inside the Prometheus container on Docker Desktop (macOS/Windows) out of the box;
# the `extra_hosts` entry in docker-compose.metrics.yml makes it resolvable on native Linux too.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: leetmind-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8099"]
        labels:
          instance: "host-dev"
      - targets: ["api:8080"]
        labels:
          instance: "dockerized"
