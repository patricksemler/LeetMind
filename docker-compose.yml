# Local-first, VPS-shaped (PLAN_BACKEND.md §2 row 19): portable to any Docker host, hosting
# itself out of scope.
services:
  # Built, not run as a standing service: judge.py launches one throwaway leetmind-judge
  # container per execution via the host docker CLI (§8.1). This service exists so a fresh
  # `docker compose up` produces the leetmind-judge image (matching JUDGE_IMAGE's default)
  # before the server needs it: the entrypoint is overridden to a no-op (the image's real
  # entrypoint, runner.py, expects a stdin handshake and would hang), so it builds, exits 0,
  # and the server's depends_on gate opens. `docker build ./apps/server/judge -t leetmind-judge`
  # still works for rebuilding it by hand.
  judge:
    build: ./apps/server/judge
    image: leetmind-judge
    entrypoint: ["/bin/true"]
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leetmind
      POSTGRES_PASSWORD: leetmind
      POSTGRES_DB: leetmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetmind -d leetmind"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: ./apps/server
    environment:
      DATABASE_URL: postgres://leetmind:leetmind@postgres:5432/leetmind
      WEB_ORIGIN: http://localhost:5173
      # Reaches the host's local `supabase start` stack from inside the container (auth is
      # mandatory, PLAN_BACKEND.md §9). host.docker.internal is built into Docker Desktop;
      # the extra_hosts entry below makes it resolve on plain Linux engines too.
      SUPABASE_URL: http://host.docker.internal:54321
      # The image ships no claude/codex binary, so real generation is impossible in-container —
      # fixture mode returns canned responses instead. For real generation run the server on
      # the host: `pnpm dev:server`.
      LLM_CLI: fixture
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./apps/server/.env
        required: false
    ports:
      - "8080:8080"
    volumes:
      # The judge orchestrator drives sibling containers on the host's docker daemon, not a
      # nested one — hence the host socket, not docker-in-docker.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      # Guarantees the leetmind-judge image exists (freshly built if needed) before the server
      # can accept a submission — the judge "service" is a build-and-exit no-op, see above.
      judge:
        condition: service_completed_successfully

volumes:
  postgres-data:
