# Grafana dashboard provisioning — loads every JSON file in /var/lib/grafana/dashboards (mounted
# from grafana/dashboards/ in this repo) on startup. No manual import step.
apiVersion: 1

providers:
  - name: leetmind
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
