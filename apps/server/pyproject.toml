[project]
name = "leetmind-server"
version = "0.1.0"
description = "LeetMind backend: learner model, generation pipeline, and judge orchestration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",  # [crypto] pulls in `cryptography`, required for RS256/ES256 verification
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "UP", "BLE"]
# B008: FastAPI's Depends()/Query()/etc. in argument defaults is the framework's own idiom, not
# the mutable-default-argument bug the rule guards against.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leetmind"]
